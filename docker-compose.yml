version: '3'
services:
  redis-master:
    container_name: redis-master
    image: redis:7.4-alpine
    command: >
      redis-server /data/redis.conf
    volumes:
      - redis-0:/data
      - ./redis/redis-0/redis.conf:/data/redis.conf
    ports:
      - "6379:6379"
    networks:
      - redis-network

  redis-slave1:
    container_name: redis-slave1
    image: redis:7.4-alpine
    command: >
      redis-server /data/redis.conf
    volumes:
      - redis-1:/data
      - ./redis/redis-1/redis.conf:/data/redis.conf
    ports:
      - "6380:6379"
    depends_on:
      - redis-master
    networks:
      - redis-network

  redis-slave2:
    container_name: redis-slave2
    image: redis:7.4-alpine
    command: >
      redis-server /data/redis.conf
    volumes:
      - redis-2:/data
      - ./redis/redis-2/redis.conf:/data/redis.conf
    ports:
      - "6381:6379"
    depends_on:
      - redis-master
    networks:
      - redis-network

  sentinel-0:
    container_name: sentinel-0
    image: redis:7.4-alpine
    command: >
      redis-sentinel /data/Sentinel.conf
    volumes:
      - Sentinel-0:/data
      - ./redis/Sentinel-0/Sentinel.conf:/data/Sentinel.conf
    ports:
      - "5000:5000"
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    networks:
      - redis-network

  sentinel-1:
    container_name: sentinel-1
    image: redis:7.4-alpine
    command: >
      redis-sentinel /data/Sentinel.conf
    volumes:
      - Sentinel-1:/data
      - ./redis/Sentinel-1/Sentinel.conf:/data/Sentinel.conf
    ports:
      - "5001:5000"
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    networks:
      - redis-network

  sentinel-2:
    container_name: sentinel-2
    image: redis:7.4-alpine
    command: >
      redis-sentinel /data/Sentinel.conf
    volumes:
      - Sentinel-2:/data
      - ./redis/Sentinel-2/Sentinel.conf:/data/Sentinel.conf
    ports:
      - "5002:5000"
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
    networks:
      - redis-network


  Notification-streams:
    container_name: Notification-streams
    image: notification-streams:latest
    build:
      context: ./Notifications-redis-streams
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
      - sentinel-0
      - sentinel-1
      - sentinel-2
    networks:
      - redis-network


  Notification-pub-sub:
    container_name: Notification-pub-sub
    image: notification-pub-sub:latest
    build:
      context: ./Notifications-redis-pubsub
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      - redis-master
      - redis-slave1
      - redis-slave2
      - sentinel-0
      - sentinel-1
      - sentinel-2
    networks:
      - redis-network

networks:
  redis-network:
    driver: bridge

volumes:
  redis-0:
  redis-1:
  redis-2:
  Sentinel-0:
  Sentinel-1:
  Sentinel-2: